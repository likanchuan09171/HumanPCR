<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scholar Profile</title>
  <meta http-equiv="refresh" content="0; url=https://scholar.google.com/citations?user=7PHvjU8AAAAJ">
  <link rel="canonical" href="https://scholar.google.com/citations?user=7PHvjU8AAAAJ">
  <style>
:root {
  color-scheme: light;
  --bg: #f6f8fb;
  --panel: #ffffff;
  --text: #142033;
  --muted: #5b6472;
  --accent: #1f5eff;
  --border: #dce3ee;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}
.wrap {
  max-width: 780px;
  margin: 0 auto;
  padding: 48px 24px 64px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px 24px;
  box-shadow: 0 12px 32px rgba(9, 26, 61, 0.08);
}
h1, h2, p, ul { margin: 0; }
h1 { font-size: 32px; line-height: 1.1; margin-bottom: 12px; }
h2 { font-size: 24px; line-height: 1.15; margin-bottom: 10px; }
p { line-height: 1.6; }
.muted { color: var(--muted); }
.links { margin-top: 24px; display: grid; gap: 14px; }
.links a {
  display: block;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  text-decoration: none;
  color: var(--text);
  background: #fbfcfe;
}
.links a:hover { border-color: var(--accent); }
.tag {
  display: inline-block;
  margin-top: 12px;
  padding: 6px 10px;
  border-radius: 999px;
  background: #edf2ff;
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
}
</style>
  <script>window.location.replace('https://scholar.google.com/citations?user=7PHvjU8AAAAJ');</script>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <span class="tag">Redirecting</span>
      <h2>Scholar Profile</h2>
      <p class="muted">If the page does not redirect automatically, open the link below.</p>
      <p style="margin-top:16px;"><a href="https://scholar.google.com/citations?user=7PHvjU8AAAAJ">https://scholar.google.com/citations?user=7PHvjU8AAAAJ</a></p>
    </section>
  </main>
</body>
</html>
